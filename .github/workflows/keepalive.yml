name: Supabase Keepalive Cron

on:
  schedule:
    # Runs every 3 hours (at 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keepalive API (.in domain)
        continue-on-error: true
        run: |
          echo "Pinging NYX Studio Supabase Keepalive endpoint (www.nyxstudio.in)..."
          RESPONSE=$(curl -sL --retry 3 --retry-delay 5 -w "\nHTTP_STATUS:%{http_code}" https://www.nyxstudio.in/api/cron/keepalive)
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | awk -F: '{print $2}')
          if [ "$STATUS" -eq 200 ]; then
            echo "Successfully pinged nyxstudio.in keepalive endpoint (HTTP 200)"
          else
            echo "Warning: nyxstudio.in keepalive endpoint returned HTTP $STATUS"
          fi

      - name: Ping Keepalive API (.tech domain)
        continue-on-error: true
        run: |
          echo "Pinging NYX Studio Supabase Keepalive endpoint (www.nyxstudio.tech)..."
          RESPONSE=$(curl -sL --retry 3 --retry-delay 5 -w "\nHTTP_STATUS:%{http_code}" https://www.nyxstudio.tech/api/cron/keepalive)
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | awk -F: '{print $2}')
          if [ "$STATUS" -eq 200 ]; then
            echo "Successfully pinged nyxstudio.tech keepalive endpoint (HTTP 200)"
          else
            echo "Warning: nyxstudio.tech keepalive endpoint returned HTTP $STATUS"
          fi

      - name: Direct Ping to Supabase Gateway
        run: |
          echo "Pinging Supabase Project REST API Gateway directly..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://tjoojjnxrtgonqucxpbc.supabase.co/rest/v1/)
          echo "Supabase REST API Gateway HTTP Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "Supabase project gateway ping successful (HTTP $STATUS)"
          else
            echo "Failed to contact Supabase project gateway (HTTP $STATUS)"
            exit 1
          fi

